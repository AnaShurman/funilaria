<!-- Mobile menu toggle -->
<button
  class="menu-toggle"
  type="button"
  (click)="toggleMenu()"
  [class.open]="isMenuOpen"
  [attr.aria-expanded]="isMenuOpen"
  aria-controls="app-sidebar"
  [attr.aria-label]="isMenuOpen ? 'Fechar menu' : 'Abrir menu'">
  <i [class]="isMenuOpen ? 'pi pi-times' : 'pi pi-bars'" aria-hidden="true"></i>
</button>

<button
  *ngIf="isMenuOpen"
  class="sidebar-overlay"
  type="button"
  aria-label="Fechar menu"
  (click)="closeMenu()">
</button>

<aside id="app-sidebar" class="sidebar" [class.open]="isMenuOpen" aria-label="Menu principal">
  <div class="sidebar-header">
    <div class="logo">
      <i class="pi pi-car" aria-hidden="true"></i>
      <span class="logo-text">Funilaria</span>
    </div>
    <button class="close-btn" type="button" (click)="closeMenu()" aria-label="Fechar menu">
      <i class="pi pi-times" aria-hidden="true"></i>
    </button>
  </div>

  <nav class="sidebar-nav" aria-label="Navegação principal">
    <a *ngFor="let item of menuItems"
      [routerLink]="item.route"
      routerLinkActive="active"
      [routerLinkActiveOptions]="{exact: true}"
      [attr.aria-current]="isActive(item.route) ? 'page' : null"
      class="nav-item"
      (click)="closeMenu()">
      <i [class]="item.icon" aria-hidden="true"></i>
      <span>{{ item.label }}</span>
    </a>
  </nav>

  <div class="sidebar-footer">
    <div class="user-info">
      <i class="pi pi-shield" aria-hidden="true"></i>
      <span>Sessão protegida</span>
    </div>
    <button class="nav-item logout-button" type="button" (click)="logout()">
      <i class="pi pi-sign-out" aria-hidden="true"></i>
      <span>Sair da conta</span>
    </button>
  </div>
</aside>
