<!-- Botão hamburguer para mobile -->
<button class="menu-toggle" (click)="toggleMenu()" [class.open]="isMenuOpen" aria-label="Abrir menu">
  <i class="pi pi-bars"></i>
</button>

<div class="sidebar-overlay" *ngIf="isMenuOpen" (click)="closeMenu()"></div>

<aside class="sidebar" [class.open]="isMenuOpen">
  <div class="sidebar-header">
    <div class="logo">
      <i class="pi pi-car"></i>
      <span class="logo-text">Funilaria</span>
    </div>
    <button class="close-btn" (click)="closeMenu()" aria-label="Fechar menu">
      <i class="pi pi-times"></i>
    </button>
  </div>

  <nav class="sidebar-nav">
    <a *ngFor="let item of menuItems"
      [routerLink]="item.route"
      routerLinkActive="active"
      [routerLinkActiveOptions]="{exact: true}"
      class="nav-item"
      (click)="closeMenu()">
      <i [class]="item.icon"></i>
      <span>{{ item.label }}</span>
    </a>
  </nav>

  <div class="sidebar-footer">
    <div class="user-info">
      <i class="pi pi-shield"></i>
      <span>Sessão protegida</span>
    </div>
    <button class="nav-item logout-button" type="button" (click)="logout()">
      <i class="pi pi-sign-out"></i>
      <span>Sair da conta</span>
    </button>
  </div>
</aside>
